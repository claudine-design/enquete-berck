<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💬 Messages voyageurs — validation</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<style>
  :root { --bleu:#3b5bdb; --rouge:#c0392b; --vert:#2e7d32; --fond:#f4f5fb; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; margin:0; background:var(--fond); color:#222; }
  header { background:var(--bleu); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:5;
           display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:17px; margin:0; }
  #compteur { background:rgba(255,255,255,.25); border-radius:12px; padding:2px 10px; font-size:14px; }
  main { padding:12px; max-width:680px; margin:auto; }
  .carte { background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); padding:14px; margin-bottom:14px; }
  .qui { font-weight:bold; font-size:15px; }
  .dates { color:#888; font-size:13px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .b-demande, .b-question { background:#e7f0ff; color:var(--bleu); }
  .b-probleme { background:#ffe9e5; color:var(--rouge); }
  .b-autre { background:#eee; color:#555; }
  .alerte { color:var(--rouge); font-size:13px; font-weight:bold; margin:6px 0; }
  .question { background:#f7f7f7; border-left:3px solid #bbb; padding:8px 10px; margin:8px 0;
              white-space:pre-wrap; font-size:14px; border-radius:0 6px 6px 0; }
  details { margin:6px 0; }
  summary { color:var(--bleu); font-size:13px; cursor:pointer; }
  .conv { white-space:pre-wrap; font-size:12px; color:#555; background:#fafafa; padding:8px; border-radius:6px; max-height:220px; overflow:auto; }
  textarea { width:100%; min-height:120px; font:inherit; font-size:14px; padding:10px; border:1px solid #ccd;
             border-radius:8px; background:#f5f7ff; resize:vertical; }
  .opt { background:#fff8e1; border:1px solid #ffe082; border-radius:8px; padding:8px 10px; margin:8px 0; font-size:14px; }
  .opt label { display:flex; gap:8px; align-items:center; }
  .boutons { display:flex; gap:8px; margin-top:10px; }
  button { flex:1; padding:12px; font-size:15px; font-weight:bold; border:0; border-radius:8px; cursor:pointer; }
  .env { background:var(--vert); color:#fff; }
  .rej { background:#eee; color:#666; flex:0 0 30%; }
  button:disabled { opacity:.5; }
  .vide { text-align:center; color:#888; padding:40px 10px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#222; color:#fff;
           padding:10px 18px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:10; }
  .toast.on { opacity:1; }
  .note-envoi { font-size:12px; color:#888; text-align:center; margin:4px 0 12px; }
  .maj { display:block; margin:10px auto 30px; background:#fff; color:var(--bleu); border:1px solid var(--bleu);
         border-radius:20px; padding:8px 22px; font-size:14px; font-weight:bold; cursor:pointer; }
  .titre-section { font-size:14px; font-weight:bold; color:#888; margin:22px 4px 10px; }
  .hint-edit { font-size:12px; color:#999; margin:8px 0 4px; }
  .langue { font-size:13px; color:#7048b6; background:#f3edff; border-radius:6px; padding:6px 9px; margin:6px 0; }
  .carte-urgence { border:2px solid var(--rouge); }
  .refo { background:#eef7ff; border:1px solid #cfe3ff; border-radius:8px; padding:10px; margin-top:10px; }
  .refo-ligne { display:flex; gap:8px; align-items:stretch; }
  .refo textarea { flex:1; min-height:52px; background:#fff; }
  .mic { flex:0 0 52px; font-size:22px; border:1px solid #cfe3ff; border-radius:8px; background:#fff; }
  .mic-on { background:var(--rouge); color:#fff; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  .gen { width:100%; margin-top:8px; background:var(--bleu); color:#fff; padding:10px; }
  .refo-btn { background:#eef7ff; color:var(--bleu); flex:0 0 34%; }
  .urgence { background:var(--rouge); color:#fff; font-weight:bold; font-size:14px;
             border-radius:6px; padding:8px 10px; margin-bottom:8px; }
  .carte-lue { opacity:.85; background:#fbfbf6; }
  .carte-lue .boutons button { padding:9px; font-size:14px; background:#8d99ae; }
</style>
</head>
<body>
<header>
  <h1>💬 Messages voyageurs</h1>
  <span id="compteur">…</span>
</header>
<main>
  <div id="note-envoi" class="note-envoi"></div>
  <div id="liste"><div class="vide">Chargement…</div></div>
  <button class="maj" onclick="charger()">🔄 Actualiser</button>
</main>
<div id="toast" class="toast"></div>

<script>
// L'URL du script est publique (protégée par le secret) ; le secret arrive par
// le #k=... du favori et reste mémorisé sur le téléphone (localStorage).
var API = 'https://script.google.com/macros/s/AKfycbxdZ3JNkHKvvlDJaP_7MzUJe3tC82PYUPmihH6RaRfqfFohn3GmChGm0vQQ4kikirp4/exec';
// La clé peut arriver via #k=… OU ?k=… (certains navigateurs mobiles gardent l'un ou l'autre).
var m = (location.hash + '&' + location.search).match(/k=([\w-]+)/);
if (m) {
  localStorage.setItem('mb_secret', m[1]);
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
}
var SECRET = localStorage.getItem('mb_secret') || '';
var items = [];

function enregistrerCle() {
  var v = (document.getElementById('cle-input').value || '').trim();
  if (!v) { toast('Colle la clé d\'abord'); return; }
  localStorage.setItem('mb_secret', v);
  SECRET = v;
  charger();
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(function(){ t.classList.remove('on'); }, 2800);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fdate(s) {
  var p = String(s || '').slice(0,10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] : (s || '');
}
var OPTION_TXT = { pack_linge:'🛏️ Pack linge', animal:'🐕 Animal', arrivee_anticipee:'⏰ Arrivée anticipée', depart_tardif:'⏰ Départ tardif' };
var LANGUES = { de:'allemand', en:'anglais', nl:'néerlandais', es:'espagnol', it:'italien', pt:'portugais', pl:'polonais' };

function apiGet(params) {
  var qs = new URLSearchParams(Object.assign({ secret: SECRET }, params)).toString();
  return fetch(API + '?' + qs).then(function(r){ return r.json(); });
}
function apiPost(body) {
  body.secret = SECRET;
  return fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                      body: JSON.stringify(body) }).then(function(r){ return r.json(); });
}

function charger() {
  if (!SECRET) {
    document.getElementById('liste').innerHTML =
      '<div class="vide">🔑 Première ouverture sur ce téléphone : colle ta clé une seule fois.<br><br>' +
      '<input id="cle-input" placeholder="colle la clé ici" ' +
      'style="width:90%;max-width:340px;padding:10px;font-size:14px;border:1px solid #ccd;border-radius:8px;">' +
      '<br><br><button onclick="enregistrerCle()" ' +
      'style="background:var(--bleu);color:#fff;border:0;border-radius:8px;padding:10px 24px;font-size:15px;font-weight:bold;">' +
      'Enregistrer</button>' +
      '<br><br><small style="color:#aaa">La clé est mémorisée : tu ne la remettras plus ensuite.</small></div>';
    return;
  }
  document.getElementById('liste').innerHTML = '<div class="vide">Chargement…</div>';
  apiGet({ action:'list' }).then(function(res) {
    if (res.error) { toast('Erreur : ' + res.error); return; }
    items = res.items || [];
    // urgences toujours en tête de liste
    items.sort(function(a, b){ return (b.urgence ? 1 : 0) - (a.urgence ? 1 : 0); });
    var aValider = items.filter(function(it){ return it.statut === 'en_attente'; });
    var sansReponse = items.filter(function(it){ return it.statut === 'courtoisie'; });
    document.getElementById('compteur').textContent = aValider.length;
    document.getElementById('note-envoi').innerHTML = res.envoiActif
      ? '✅ Envoi direct Beds24 actif : 1 clic = message envoyé au voyageur'
      : '⚠️ Envoi direct pas encore activé : la validation prépare le message, envoi manuel sur Booking';
    var el = document.getElementById('liste');
    if (!items.length) { el.innerHTML = '<div class="vide">🎉 Rien à valider — tout est traité !</div>'; return; }
    var html = '';
    items.forEach(function(it, i) {
      if (it.statut !== 'en_attente') return;
      var badge = 'b-' + (['demande','question','probleme'].indexOf(it.categorie) >= 0 ? it.categorie : 'autre');
      var opt = '';
      if (it.option_type) {
        opt = '<div class="opt"><label><input type="checkbox" id="cal-' + i + '" checked> ' +
              (OPTION_TXT[it.option_type] || esc(it.option_type)) +
              (it.option_detail ? ' — ' + esc(it.option_detail) : '') +
              ' → créer l\'événement sur le calendrier DRAP / Check-in</label></div>';
      }
      html += '<div class="carte' + (it.urgence ? ' carte-urgence' : '') + '" data-statut="en_attente" id="carte-' + i + '">' +
        (it.urgence ? '<div class="urgence">🚨 URGENCE — ' + esc(it.urgence) + '</div>' : '') +
        '<div class="qui">' + esc(it.appart) + ' — ' + esc(it.voyageur) +
        '<span class="badge ' + badge + '">' + esc(it.categorie) + '</span></div>' +
        '<div class="dates">Séjour ' + fdate(it.arrivee) + ' → ' + fdate(it.depart) + ' · reçu le ' + esc(it.genere_le) + '</div>' +
        (it.langue && it.langue !== 'fr' ? '<div class="langue">🌐 Le voyageur écrit en ' +
            (LANGUES[it.langue] || esc(it.langue)) + ' — vous validez en français, il recevra la réponse traduite en ' +
            (LANGUES[it.langue] || esc(it.langue)) + '.</div>' : '') +
        (it.besoin_claudine && it.note_interne ? '<div class="alerte">⚠️ ' + esc(it.note_interne) + '</div>' : '') +
        '<div class="question">💬 ' + esc(it.question) + '</div>' +
        '<details><summary>Voir toute la conversation</summary><div class="conv">' + esc(it.conversation) + '</div></details>' +
        opt +
        '<div class="hint-edit">✏️ Touchez le texte pour le modifier avant d\'envoyer — le robot apprendra de votre version :</div>' +
        '<textarea id="txt-' + i + '">' + esc(it.proposition || '') + '</textarea>' +
        '<div class="refo" id="refo-' + i + '" style="display:none">' +
          '<div class="hint-edit">Dites (ou tapez) ce que vous voulez répondre — Claude rédige le message poli à votre façon :</div>' +
          '<div class="refo-ligne">' +
          '<textarea id="consigne-' + i + '" rows="2" placeholder="Ex : finalement je ne peux pas accepter 3 chiens, l\'appartement ne convient pas"></textarea>' +
          '<button class="mic" id="mic-' + i + '" onclick="dicter(' + i + ')" title="Dicter à la voix">🎤</button>' +
          '</div>' +
          '<button class="gen" id="gen-' + i + '" onclick="genererReformulation(' + i + ')">🪄 Rédiger le message</button>' +
        '</div>' +
        '<div class="boutons">' +
        '<button class="rej" onclick="rejeter(' + i + ')">🚫 Ignorer</button>' +
        '<button class="refo-btn" onclick="toggleReformuler(' + i + ')">🪄 Reformuler</button>' +
        '<button class="env" id="btn-' + i + '" onclick="valider(' + i + ')">✅ Envoyer</button>' +
        '</div></div>';
    });
    if (sansReponse.length) {
      html += '<div class="titre-section">🕊️ Sans réponse nécessaire — à marquer « lu » (' + sansReponse.length + ')</div>';
      items.forEach(function(it, i) {
        if (it.statut !== 'courtoisie') return;
        html += '<div class="carte carte-lue" data-statut="courtoisie" id="carte-' + i + '">' +
          '<div class="qui">' + esc(it.appart) + ' — ' + esc(it.voyageur) + '</div>' +
          '<div class="question">💬 ' + esc(it.question) + '</div>' +
          '<details><summary>Voir toute la conversation</summary><div class="conv">' + esc(it.conversation) + '</div></details>' +
          '<div class="boutons">' +
          '<button class="env" id="btn-' + i + '" onclick="marquerLu(' + i + ')">✓ Conversation lue</button>' +
          '</div></div>';
      });
    }
    el.innerHTML = html || '<div class="vide">🎉 Rien à valider — tout est traité !</div>';
  }).catch(function(e){ toast('Erreur réseau : ' + e.message); });
}

function retirerCarte(i) {
  var c = document.getElementById('carte-' + i);
  if (c) c.remove();
  document.getElementById('compteur').textContent =
    document.querySelectorAll('.carte[data-statut="en_attente"]').length;
  if (!document.querySelectorAll('.carte').length) {
    document.getElementById('liste').innerHTML = '<div class="vide">🎉 Rien à valider — tout est traité !</div>';
  }
}

function marquerLu(i) {
  var it = items[i];
  var btn = document.getElementById('btn-' + i);
  btn.disabled = true; btn.textContent = '…';
  apiPost({ action:'marquerLu', id: it.id }).then(function(res) {
    if (res.error) { throw new Error(res.error); }
    retirerCarte(i);
    toast('✓ Marquée lue (' + (res.marques || 0) + ' message(s))');
  }).catch(function(e) {
    btn.disabled = false; btn.textContent = '✓ Conversation lue';
    toast('Erreur : ' + e.message);
  });
}

function valider(i) {
  var it = items[i];
  var txt = document.getElementById('txt-' + i).value.trim();
  if (!txt) { toast('La réponse est vide'); return; }
  var cal = it.option_type ? document.getElementById('cal-' + i).checked : false;
  var btn = document.getElementById('btn-' + i);
  btn.disabled = true; btn.textContent = 'Envoi…';
  apiPost({ action:'valider', id: it.id, texte: txt, cal: cal }).then(function(res) {
    if (res.error) { throw new Error(res.error); }
    retirerCarte(i);
    toast(res.envoyee ? '✅ Envoyé au voyageur' + (res.calendrier ? ' + 📅 calendrier' : '')
                      : '📋 Validé — à envoyer à la main sur Booking (' + (res.raison || '') + ')');
  }).catch(function(e) {
    btn.disabled = false; btn.textContent = '✅ Valider & envoyer';
    toast('Erreur : ' + e.message);
  });
}

function toggleReformuler(i) {
  var d = document.getElementById('refo-' + i);
  d.style.display = (d.style.display === 'none') ? 'block' : 'none';
  if (d.style.display === 'block') document.getElementById('consigne-' + i).focus();
}

var reco = null;
function dicter(i) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Micro non supporté ici — utilisez le micro 🎤 du clavier'); return; }
  var btn = document.getElementById('mic-' + i);
  if (reco) { reco.stop(); return; }
  reco = new SR();
  reco.lang = 'fr-FR'; reco.interimResults = false; reco.continuous = true;
  btn.classList.add('mic-on'); btn.textContent = '⏹';
  reco.onresult = function (ev) {
    var t = '';
    for (var k = ev.resultIndex; k < ev.results.length; k++) t += ev.results[k][0].transcript;
    var c = document.getElementById('consigne-' + i);
    c.value = (c.value ? c.value + ' ' : '') + t.trim();
  };
  reco.onend = function () { btn.classList.remove('mic-on'); btn.textContent = '🎤'; reco = null; };
  reco.onerror = function () { btn.classList.remove('mic-on'); btn.textContent = '🎤'; reco = null;
                               toast('Micro indisponible — utilisez le micro du clavier'); };
  reco.start();
  toast('🎤 Parlez… (retouchez ⏹ pour arrêter)');
}

function genererReformulation(i) {
  var it = items[i];
  var consigne = document.getElementById('consigne-' + i).value.trim();
  if (!consigne) { toast('Dites d\'abord ce que vous voulez répondre'); return; }
  var g = document.getElementById('gen-' + i);
  g.disabled = true; g.textContent = '🪄 Rédaction en cours…';
  apiPost({ action:'reformuler', id: it.id, consigne: consigne }).then(function(res) {
    if (res.error) { throw new Error(res.error); }
    document.getElementById('txt-' + i).value = res.texte;
    g.disabled = false; g.textContent = '🪄 Rédiger le message';
    toast('✏️ Nouveau message rédigé — relisez puis Envoyer');
  }).catch(function(e) {
    g.disabled = false; g.textContent = '🪄 Rédiger le message';
    toast('Erreur : ' + e.message);
  });
}

function rejeter(i) {
  var it = items[i];
  if (!confirm('Ignorer ce message ? (aucune réponse ne sera envoyée)')) return;
  apiPost({ action:'rejeter', id: it.id }).then(function(res) {
    if (res.error) { throw new Error(res.error); }
    retirerCarte(i);
    toast('🚫 Ignoré');
  }).catch(function(e){ toast('Erreur : ' + e.message); });
}

charger();
</script>
</body>
</html>
